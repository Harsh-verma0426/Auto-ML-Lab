[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-ml-lab"
version = "0.1.0"
description = "An experimental automated machine learning system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]
